<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap - GameFandom</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .login-container {
            max-width: 400px;
            margin: 50px auto;
            padding: 40px;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05));
            backdrop-filter: blur(20px);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .login-header h2 {
            font-size: 28px;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #007bff, #00ff88);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
        }

        .login-header p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 16px;
        }

        .form-group {
            margin-bottom: 25px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.9);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            padding: 15px;
            padding-left: 45px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .form-group i {
            position: absolute;
            left: 15px;
            top: 45px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 18px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #007bff;
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 0 4px rgba(0, 123, 255, 0.1);
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .remember-me input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #007bff;
        }

        .remember-me label {
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            user-select: none;
            cursor: pointer;
        }

        .forgot-password {
            text-align: right;
            margin-bottom: 30px;
        }

        .forgot-password a {
            color: #007bff;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s ease;
        }

        .forgot-password a:hover {
            color: #0056b3;
        }

        .login-button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(45deg, #007bff, #00ff88);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 123, 255, 0.3);
        }

        .login-button:active {
            transform: translateY(0);
        }

        .register-link {
            text-align: center;
            margin-top: 30px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
        }

        .register-link a {
            color: #007bff;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .register-link a:hover {
            color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h2>Giriş Yap</h2>
            <p>GameFandom hesabına giriş yap</p>
        </div>

        <div class="form-group">
            <label for="username">Adınız Soyadınız</label>
            <i class="fas fa-user"></i>
            <input type="text" id="username" name="username" placeholder="adınız soyadınız " required>
        </div>

        <div class="form-group">
            <label>Şifre</label>
            <i class="fas fa-lock"></i>
            <input type="password" id="password" placeholder="Şifreniz">
        </div>

        <div class="remember-me">
            <input type="checkbox" id="remember">
            <label for="remember">Beni hatırla</label>
        </div>

        <div class="forgot-password">
            <a href="#" onclick="alert('Şifre sıfırlama özelliği yakında eklenecek!')">Şifremi unuttum</a>
        </div>

        <button onclick="login()" class="login-button">Giriş Yap</button>

        <div class="register-link">
            Hesabın yok mu? <a href="register.html">Kayıt ol</a>
        </div>
    </div>

    <script>
        function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            // Kullanıcı kayıtlarını kontrol et
            const registeredUsers = JSON.parse(localStorage.getItem('registerLogs') || '[]');
            const user = registeredUsers.find(u => u.username === username && u.password === password);

            // Log objesi oluştur
            const logEntry = {
                username: username,
                date: new Date().toLocaleString('tr-TR'),
                success: !!user
            };

            // Giriş loglarını güncelle
            const loginLogs = JSON.parse(localStorage.getItem('loginLogs') || '[]');
            loginLogs.unshift(logEntry);
            localStorage.setItem('loginLogs', JSON.stringify(loginLogs));

            if (user) {
                // Giriş başarılı
                localStorage.setItem('loggedIn', 'true');
                localStorage.setItem('username', username);
                window.location.href = '../index.html';
            } else {
                // Giriş başarısız - hata mesajını göster
                const errorDiv = document.getElementById('error-message');
                errorDiv.style.display = 'block';
                errorDiv.innerHTML = `
                    <div style="background: rgba(220, 53, 69, 0.1); color: #dc3545; padding: 10px; border-radius: 5px; margin-bottom: 15px;">
                        <i class="fas fa-exclamation-circle"></i>
                        Kullanıcı adı veya şifre hatalı
                    </div>
                `;
                
                // 3 saniye sonra hata mesajını gizle
                setTimeout(() => {
                    errorDiv.style.display = 'none';
                }, 3000);
            }
        }

        // Enter tuşu ile giriş yapma
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                login();
            }
        });
    </script>
</body>
</html>
