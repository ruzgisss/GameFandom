<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ödeme İşleniyor - GameFandom</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .countdown-container {
            max-width: 600px;
            margin: 100px auto;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            text-align: center;
            color: white;
        }

        .countdown-header {
            margin-bottom: 40px;
        }

        .countdown-header h2 {
            font-size: 28px;
            color: #00ff88;
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
        }

        .countdown-header p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 16px;
            line-height: 1.6;
        }

        .countdown-timer {
            font-size: 64px;
            font-weight: 700;
            color: #00ff88;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
            margin: 40px 0;
            font-family: monospace;
        }

        .loading-bar {
            width: 100%;
            height: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            margin: 30px 0;
            overflow: hidden;
        }

        .loading-progress {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #007bff, #00ff88);
            border-radius: 5px;
            transition: width 1s linear;
        }

        .info-box {
            background: rgba(0, 123, 255, 0.1);
            border: 2px solid rgba(0, 123, 255, 0.2);
            border-radius: 15px;
            padding: 20px;
            margin-top: 40px;
        }

        .info-box h3 {
            color: #00ff88;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .info-box ul {
            text-align: left;
            list-style: none;
            padding: 0;
        }

        .info-box li {
            margin: 10px 0;
            padding-left: 25px;
            position: relative;
            color: rgba(255, 255, 255, 0.8);
        }

        .info-box li i {
            position: absolute;
            left: 0;
            top: 4px;
            color: #00ff88;
        }

        .home-button {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #007bff;
            color: white;
            padding: 15px 30px;
            border-radius: 10px;
            text-decoration: none;
            margin-top: 30px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .home-button:hover {
            background: #0056b3;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.3);
        }
    </style>
</head>
<body>
    <div class="countdown-container">
        <div class="countdown-header">
            <h2>Ödemeniz İşleniyor</h2>
            <p>Premium üyeliğiniz aktif edilmeden önce ödemenizin onaylanması bekleniyor.</p>
        </div>

        <div class="countdown-timer" id="timer">25:00</div>

        <div class="loading-bar">
            <div class="loading-progress" id="progress"></div>
        </div>

        <div class="info-box">
            <h3>Bilgilendirme</h3>
            <ul>
                <li><i class="fas fa-check"></i> Ödemeniz başarıyla alındı</li>
                <li><i class="fas fa-clock"></i> İşlem süresi maksimum 25 dakikadır</li>
                <li><i class="fas fa-shield-alt"></i> Premium özellikler otomatik aktif edilecek</li>
                <li><i class="fas fa-bell"></i> Aktivasyon sonrası bildirim alacaksınız</li>
            </ul>
        </div>

        <a href="../index.html" class="home-button">
            <i class="fas fa-home"></i>
            Ana Sayfaya Dön
        </a>
    </div>

    <script>
        // 25 dakikalık sayaç
        let timeLeft = 25 * 60; // 25 dakika = 1500 saniye
        const timerElement = document.getElementById('timer');
        const progressElement = document.getElementById('progress');

        function updateTimer() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            
            // Sayacı güncelle
            timerElement.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            
            // İlerleme çubuğunu güncelle
            const progress = ((1500 - timeLeft) / 1500) * 100;
            progressElement.style.width = `${progress}%`;

            if (timeLeft > 0) {
                timeLeft--;
                setTimeout(updateTimer, 1000);
            } else {
                // Süre dolduğunda
                timerElement.textContent = "00:00";
                timerElement.style.color = "#00ff88";
                alert("Premium üyeliğiniz aktif edildi! Ana sayfaya yönlendiriliyorsunuz.");
                window.location.href = '../index.html';
            }
        }

        // Sayacı başlat
        updateTimer();
    </script>
</body>
</html>
