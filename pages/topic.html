<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konu Detayı - GameFandom</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .topic-container {
            max-width: 1000px;
            margin: 50px auto;
            padding: 20px;
        }

        .topic-header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .topic-title {
            font-size: 28px;
            color: white;
            margin-bottom: 20px;
        }

        .topic-meta {
            display: flex;
            gap: 20px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 20px;
        }

        .topic-meta i {
            margin-right: 5px;
        }

        .topic-content {
            color: rgba(255, 255, 255, 0.9);
            line-height: 1.6;
            font-size: 16px;
        }

        .comments-section {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 15px;
            padding: 30px;
        }

        .comments-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .comments-header h2 {
            color: white;
            font-size: 24px;
        }

        .comment-count {
            background: rgba(0, 123, 255, 0.2);
            color: #007bff;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
        }

        .comment-list {
            margin-bottom: 30px;
        }

        .comment-item {
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .comment-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .comment-author {
            color: #007bff;
            font-weight: 600;
        }

        .comment-date {
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
        }

        .comment-content {
            color: rgba(255, 255, 255, 0.9);
            line-height: 1.5;
        }

        .new-comment {
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
            border-radius: 10px;
        }

        .new-comment textarea {
            width: 100%;
            height: 100px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: white;
            font-size: 16px;
            margin-bottom: 15px;
            resize: vertical;
        }

        .new-comment button {
            background: #007bff;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .new-comment button:hover {
            background: #0056b3;
            transform: translateY(-2px);
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .back-button:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>
    <div class="topic-container">
        <a href="community.html" class="back-button">
            <i class="fas fa-arrow-left"></i>
            Topluluk'a Dön
        </a>

        <div class="topic-header">
            <h1 class="topic-title" id="topicTitle"></h1>
            <div class="topic-meta">
                <span><i class="fas fa-user"></i><span id="topicAuthor"></span></span>
                <span><i class="fas fa-clock"></i><span id="topicDate"></span></span>
                <span><i class="fas fa-eye"></i><span id="topicViews"></span> görüntülenme</span>
            </div>
            <div class="topic-content" id="topicContent"></div>
        </div>

        <div class="comments-section">
            <div class="comments-header">
                <h2>Yorumlar</h2>
                <span class="comment-count" id="commentCount">0 yorum</span>
            </div>

            <div class="comment-list" id="commentList">
                <!-- Yorumlar JavaScript ile eklenecek -->
            </div>

            <div class="new-comment">
                <textarea id="newCommentText" placeholder="Yorumunuzu yazın..."></textarea>
                <button onclick="addComment()">Yorum Yap</button>
            </div>
        </div>
    </div>

    <script>
        // URL'den konu ID'sini al
        const urlParams = new URLSearchParams(window.location.search);
        const topicId = parseInt(urlParams.get('id'));

        // Konuyu ve yorumları yükle
        function loadTopic() {
            const topics = JSON.parse(localStorage.getItem('communityTopics')) || [];
            const topic = topics.find(t => t.id === topicId);

            if (topic) {
                document.getElementById('topicTitle').textContent = topic.title;
                document.getElementById('topicAuthor').textContent = topic.author;
                document.getElementById('topicDate').textContent = topic.date;
                document.getElementById('topicContent').textContent = topic.content;
                document.getElementById('topicViews').textContent = (topic.views || 0) + 1;

                // Görüntülenme sayısını artır
                topic.views = (topic.views || 0) + 1;
                localStorage.setItem('communityTopics', JSON.stringify(topics));

                loadComments();
            }
        }

        // Yorumları yükle
        function loadComments() {
            const comments = JSON.parse(localStorage.getItem(`comments_${topicId}`)) || [];
            const commentList = document.getElementById('commentList');
            const commentCount = document.getElementById('commentCount');

            commentList.innerHTML = '';
            commentCount.textContent = `${comments.length} yorum`;

            comments.forEach(comment => {
                const commentElement = document.createElement('div');
                commentElement.className = 'comment-item';
                commentElement.innerHTML = `
                    <div class="comment-header">
                        <span class="comment-author">${comment.author}</span>
                        <span class="comment-date">${comment.date}</span>
                    </div>
                    <div class="comment-content">${comment.content}</div>
                `;
                commentList.appendChild(commentElement);
            });
        }

        // Yeni yorum ekle
        function addComment() {
            const commentText = document.getElementById('newCommentText').value;

            if (!commentText.trim()) {
                alert('Lütfen bir yorum yazın!');
                return;
            }

            const comment = {
                author: 'Misafir Kullanıcı', // Gerçek uygulamada oturum açmış kullanıcının adı gelecek
                content: commentText,
                date: new Date().toLocaleString('tr-TR')
            };

            const comments = JSON.parse(localStorage.getItem(`comments_${topicId}`)) || [];
            comments.push(comment);
            localStorage.setItem(`comments_${topicId}`, JSON.stringify(comments));

            // Yorum sayısını güncelle
            const topics = JSON.parse(localStorage.getItem('communityTopics')) || [];
            const topic = topics.find(t => t.id === topicId);
            if (topic) {
                topic.comments = (topic.comments || 0) + 1;
                localStorage.setItem('communityTopics', JSON.stringify(topics));
            }

            // Yorumları yeniden yükle ve formu temizle
            loadComments();
            document.getElementById('newCommentText').value = '';
        }

        // Sayfa yüklendiğinde konuyu ve yorumları göster
        loadTopic();
    </script>
</body>
</html>
