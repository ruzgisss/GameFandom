<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yönetici Girişi - GameFandom</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        .admin-login-container {
            max-width: 400px;
            margin: 100px auto;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
        }

        .admin-login-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .admin-login-form input {
            padding: 12px;
            border: none;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 16px;
        }

        .admin-login-form input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .admin-login-form button {
            padding: 12px;
            border: none;
            border-radius: 5px;
            background: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .admin-login-form button:hover {
            background: #0056b3;
        }

        .error-message {
            color: #ff4444;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>
    <div class="admin-login-container">
        <h2 style="text-align: center; margin-bottom: 30px;">Yönetici Girişi</h2>
        <form class="admin-login-form" onsubmit="return validateLogin(event)">
            <input type="text" id="username" placeholder="Kullanıcı Adı" required>
            <input type="password" id="password" placeholder="Şifre" required>
            <p id="error-message" class="error-message">Hatalı kullanıcı adı veya şifre!</p>
            <button type="submit">Giriş Yap</button>
        </form>
    </div>

    <script>
        function validateLogin(event) {
            event.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('error-message');
            
            // Örnek yönetici bilgileri (gerçek uygulamada bu bilgiler güvenli bir şekilde saklanmalıdır)
            const adminUsername = 'admin';
            const adminPassword = 'admin123';
            
            if (username === adminUsername && password === adminPassword) {
                // Başarılı giriş
                localStorage.setItem('adminLoggedIn', 'true');
                window.location.href = 'admin-panel.html';
            } else {
                // Hatalı giriş
                errorMessage.style.display = 'block';
            }
            
            return false;
        }
    </script>
</body>
</html>
